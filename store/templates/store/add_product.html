<h1>Add Product</h1>

<form method="post">
    {% csrf_token %}

    Name:
    <input type="text" name="name"><br>

    Price:
    <input type="number" step="0.01" name="price"><br>

    Quantity:
    <input type="number" name="quantity"><br>

    <button type="submit">Add Product</button>
</form>
