{% extends "base.html" %}

{% block content %}
<h3 class="mb-4">Sales Records</h3>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Customer</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Total Amount</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        {% for sale in sales %}
        <tr>
            <td>{{ sale.customer_name }}</td>
            <td>{{ sale.product.name }}</td>
            <td>{{ sale.quantity }}</td>
            <td>{{ sale.total_amount }}</td>
            <td>{{ sale.date }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
